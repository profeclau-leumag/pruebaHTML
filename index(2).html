<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una página sencilla para practicar despliegues con GitHub y Railway.">
  <title>Mi primera web</title>

  <style>
    :root {
      --fondo: #f5f3ff;
      --tarjeta: rgba(255, 255, 255, 0.88);
      --texto: #24213a;
      --suave: #69657d;
      --morado: #6d4aff;
      --celeste: #37b9da;
      --borde: rgba(109, 74, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      color: var(--texto);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(55, 185, 218, 0.25), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(109, 74, 255, 0.25), transparent 30%),
        var(--fondo);
    }

    .decoracion {
      position: fixed;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      pointer-events: none;
    }

    .decoracion.uno {
      top: -95px;
      right: -70px;
      background: linear-gradient(135deg, var(--morado), #b5a4ff);
    }

    .decoracion.dos {
      bottom: -120px;
      left: -70px;
      background: linear-gradient(135deg, var(--celeste), #b7eff8);
    }

    main {
      width: min(100%, 780px);
      padding: clamp(32px, 7vw, 70px);
      text-align: center;
      border: 1px solid var(--borde);
      border-radius: 30px;
      background: var(--tarjeta);
      box-shadow: 0 24px 70px rgba(50, 39, 110, 0.14);
      backdrop-filter: blur(12px);
      animation: aparecer 700ms ease-out both;
    }

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 8px 14px;
      color: var(--morado);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--borde);
      border-radius: 999px;
      background: #f8f6ff;
    }

    .punto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2acb91;
      box-shadow: 0 0 0 4px rgba(42, 203, 145, 0.16);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 5.7rem);
      line-height: 0.95;
      letter-spacing: -0.065em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(110deg, var(--morado), var(--celeste));
      background-clip: text;
      -webkit-background-clip: text;
    }

    .descripcion {
      max-width: 560px;
      margin: 24px auto 30px;
      color: var(--suave);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.7;
    }

    button {
      padding: 14px 22px;
      color: white;
      font: inherit;
      font-weight: 750;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, var(--morado), #856bff);
      box-shadow: 0 12px 24px rgba(109, 74, 255, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 28px rgba(109, 74, 255, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    #mensaje {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--morado);
      font-weight: 700;
    }

    footer {
      margin-top: 32px;
      color: #928ea3;
      font-size: 0.86rem;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      button { transition: none; }
    }
  </style>
</head>

<body>
  <div class="decoracion uno" aria-hidden="true"></div>
  <div class="decoracion dos" aria-hidden="true"></div>

  <main>
    <div class="etiqueta">
      <span class="punto"></span>
      Sitio publicado
    </div>

    <h1>Mi primera <span>web</span></h1>

    <p class="descripcion">
      Una página sencilla, bonita y adaptable a celulares para practicar
      cómo subir un proyecto a GitHub y publicarlo en Railway.
    </p>

    <button id="boton" type="button">Probar la página</button>
    <p id="mensaje" aria-live="polite"></p>

    <footer>Hecho con HTML, CSS y un poquito de JavaScript ✦</footer>
  </main>

  <script>
    const boton = document.querySelector("#boton");
    const mensaje = document.querySelector("#mensaje");

    boton.addEventListener("click", () => {
      mensaje.textContent = "¡Funciona! Tu página ya está lista para publicar 🚀";
      boton.textContent = "¡Todo listo!";
    });
  </script>
</body>
</html>
